name: macOS Developer ID release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character Git SHA to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-notarized-release:
    runs-on: macos-14
    timeout-minutes: 75
    environment: macos-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
      - name: Bind workflow to the requested immutable source
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(printf '%s' "$RELEASE_SHA" | wc -c | tr -d ' ')" = "40"
          case "$RELEASE_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[packaging]'
      - name: Require release credentials
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$SIGNING_IDENTITY"
          test -n "$TEAM_ID"
          test -n "$NOTARY_KEY_BASE64"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
      - name: Import ephemeral Developer ID identity
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$RUNNER_TEMP/release.keychain-db" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
      - name: Materialize App Store Connect notary key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"
      - name: Build self-contained Core helper
        env:
          PROJECT_BRAIN_HELPER_DIST: ${{ runner.temp }}/helper-dist
          PROJECT_BRAIN_HELPER_WORK: ${{ runner.temp }}/helper-work
        run: scripts/build-macos-helper.sh
      - name: Run full Core verification
        run: scripts/verify-core.sh
      - name: Run Swift package tests
        run: swift test --package-path apps/macos/ProjectBrain
      - name: Run Xcode tests
        env:
          PROJECT_BRAIN_BUNDLED_HELPER: ${{ runner.temp }}/helper-dist/project-brain
        run: |
          xcodebuild \
            -project apps/macos/ProjectBrain/ProjectBrain.xcodeproj \
            -scheme ProjectBrain \
            -destination 'platform=macOS' \
            -derivedDataPath "${{ runner.temp }}/ReleaseTestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build, sign, notarize, staple, and verify Build 10
        env:
          PROJECT_BRAIN_BUNDLED_HELPER: ${{ runner.temp }}/helper-dist/project-brain
          PROJECT_BRAIN_RELEASE_DERIVED_DATA: ${{ runner.temp }}/Build10DerivedData
          PROJECT_BRAIN_RELEASE_OUTPUT_DIR: ${{ runner.temp }}/Project-Brain-Build10-arm64
          PROJECT_BRAIN_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          PROJECT_BRAIN_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROJECT_BRAIN_NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          PROJECT_BRAIN_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          PROJECT_BRAIN_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          PROJECT_BRAIN_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/build-notarized-release-artifact.sh
      - name: Verify final manifest and byte bindings
        run: python scripts/verify-notarized-release-artifact.py "${{ runner.temp }}/Project-Brain-Build10-arm64"
      - name: Verify signed and stapled artifact with Gatekeeper
        run: scripts/verify-notarized-gatekeeper.sh "${{ runner.temp }}/Project-Brain-Build10-arm64/Project-Brain-Build10-arm64.dmg"
      - name: Verify final DMG App and embedded helper task flow
        run: python scripts/verify-bundled-helper-local-task.py "${{ runner.temp }}/Project-Brain-Build10-arm64/Project-Brain-Build10-arm64.dmg" --evidence-output "${{ runner.temp }}/build10-release-timing-evidence.json"
      - name: Verify final DMG and Applications copies remain single instance
        run: scripts/verify-final-app-single-instance.sh "${{ runner.temp }}/Project-Brain-Build10-arm64/Project-Brain-Build10-arm64.dmg"
      - name: Upload only Developer ID signed and notarized Build 10
        uses: actions/upload-artifact@v4
        with:
          name: Project-Brain-Build10-arm64
          path: ${{ runner.temp }}/Project-Brain-Build10-arm64
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral release credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
